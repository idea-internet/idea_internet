name = "27c-site"
main = "src/index.ts"
compatibility_date = "2025-08-26"
compatibility_flags = ["nodejs_compat"]

# Structured request/error logs (see src/index.ts) — view with `npm run tail`
[observability]
enabled = true

[[kv_namespaces]]
binding = "SITE_STORAGE"
id = "d593065d87744fd7808537a2cc6cca02"
preview_id = "445887004afa4d5cb97b51cb4167a52d"

[[r2_buckets]]
binding = "SITE_ASSETS"
bucket_name = "27c-site-assets"

[dev]
port = 8788

# Custom domains (production). Mirrors the dashboard config — aliases map to
# canonical platform domains in code (see DOMAIN_ALIASES in src/index.ts).
# Wildcard certs for *.27c.site / *.27ai.cloud require Advanced Certificate Mgr.
routes = [
  { pattern = "27c.site", custom_domain = true },
  { pattern = "*.27c.site", custom_domain = true },
  { pattern = "api.27c.site", custom_domain = true },
  { pattern = "27ai.cloud", custom_domain = true },
  { pattern = "*.27ai.cloud", custom_domain = true },
  { pattern = "api.27ai.cloud", custom_domain = true },
  { pattern = "27c-site.ccwu.cc", custom_domain = true },
  { pattern = "*.27c-site.ccwu.cc", custom_domain = true },
  { pattern = "api.27c-site.ccwu.cc", custom_domain = true },
  { pattern = "idea-27c.ccwu.cc", custom_domain = true },
  { pattern = "*.idea-27c.ccwu.cc", custom_domain = true },
  { pattern = "api.idea-27c.ccwu.cc", custom_domain = true },
  { pattern = "prourl.ccwu.cc", custom_domain = true },
  { pattern = "*.prourl.ccwu.cc", custom_domain = true },
  { pattern = "api.prourl.ccwu.cc", custom_domain = true },
]
workers_dev = true
